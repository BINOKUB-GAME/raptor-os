# ==============================================================================
# RAPTOR-OS // PARE-FEU DÉFENSIF PF (Packet Filter)
# Architecture : OpenBSD 8.0 - Filtrage dynamique & Confinement automatique
# ==============================================================================

# 1. Définition des interfaces et tables dynamiques
ext_if = "vio0"

# Table persistante stockée en mémoire noyau (gérée par RAPTOR / overload)
pass in quick proto tcp from 10.0.2.2 to any port 22
table <badhosts> persist file "/etc/pf.raptor_ban"

# 2. Options globales et normalisation
set skip on lo
set block-policy drop
set loginterface $ext_if

# Réassemblage et assainissement des paquets malformés
match in all scrub (no-df random-id max-mss 1440)

# 3. Politique par défaut : BLOCAGE SILENCIEUX ABSOLU
block drop all

# 4. Confinement immédiat : neutralisation totale des hôtes marqués
block drop in quick on $ext_if from <badhosts> to any

# 5. Flux sortants autorisés (NTP, DNS, requêtes sortantes de maintenance)
pass out on $ext_if proto { tcp, udp, icmp } all modulate state

# 6. Flux entrants protégés avec détection d'abus (Overload -> badhosts)
# Protection SSH (Port 22) : max 10 connexions, max 3 tentatives en 5 secondes
pass in on $ext_if proto tcp to any port 22 keep state \
    (max-src-conn 10, max-src-conn-rate 3/5, overload <badhosts> flush global)

# Accès HTTP (Port 80) : prêt pour le serveur HTTP Vault
pass in on $ext_if proto tcp to any port 80 keep state \
    (max-src-conn 100, max-src-conn-rate 50/5, overload <badhosts> flush global)

# Autoriser le ping ICMP standard (sans fragmentation)
pass in inet proto icmp all icmp-type echoreq
